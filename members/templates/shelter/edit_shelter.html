{% extends "master.html" %}

{% block title %}
  Edit Shelter
{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 800px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-primary font-weight-bold mb-4">Edit Shelter</h3>

      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small">{{ field.errors|striptags }}</div>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'shelter' %}" class="btn btn-outline-secondary ml-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
